# LiveKit server, development profile.
#
# The awkward part of running LiveKit in Docker is ICE: the server advertises
# the addresses a peer should connect to, and here there are two different
# peers on two different networks. The browser is on the host and reaches the
# container through a published port; the agent worker is inside the compose
# network and reaches it by service name. No single advertised IP is correct
# for both.
#
# The settings below give each peer a candidate it can actually route to:
#   * the container address       — advertised by default; the agent on the
#                                   compose network dials it directly.
#   * enable_loopback_candidate   — also advertises 127.0.0.1. The browser on
#                                   the host reaches it through the published
#                                   7881/7882, without depending on the browser
#                                   leaking a host IP. (Do not replace this with
#                                   node_ip: 127.0.0.1 while the worker runs in
#                                   compose: the agent would dial its own
#                                   loopback.)
#   * use_external_ip: false      — do not advertise a cloud/LAN address that
#                                   neither peer can route to.
# Both the UDP and the TCP candidate exist for each address, so a blocked UDP
# port falls back to TCP 7881 on loopback too.
#
# Local only. A deployment behind a public hostname needs node_ip / external IP,
# TURN, and TLS (wss://) in front of 7880 instead.

port: 7880

rtc:
  udp_port: 7882
  tcp_port: 7881
  # Off deliberately: STUN-discovered public addresses are wrong for both peers
  # in this topology and only add candidates that time out.
  use_external_ip: false
  enable_loopback_candidate: true

# Overridden by --dev, which installs devkey/secret. Listed so the pair the
# rest of the stack is configured with is visible in one place.
keys:
  devkey: secret

logging:
  level: info
  json: false
