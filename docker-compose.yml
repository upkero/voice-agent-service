services:
  livekit:
    # Pinned: rtc.enable_loopback_candidate in config/livekit.yaml needs >= 1.13.
    image: livekit/livekit-server:v1.13.4
    # --dev issues the well-known devkey/secret pair and skips TLS, which is
    # what makes this stack runnable with no account anywhere. Those
    # credentials are public knowledge: anyone who reaches 7880 can sign an
    # admin token with them. Hence every port below is published on loopback
    # only — a laptop on public Wi-Fi is "outside a laptop" too.
    command: --config /etc/livekit.yaml --dev
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"      # signalling (WebSocket) and the management API
      - "127.0.0.1:7881:7881"      # ICE over TCP, the fallback when UDP is blocked
      - "127.0.0.1:7882:7882/udp"  # ICE over UDP, the normal media path
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880"]
      interval: 5s
      timeout: 3s
      retries: 10

  voice-api:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      # Two different addresses for the same server, because two different peers
      # reach it. The token carries the URL the *browser* must dial (localhost,
      # from outside the network); the readiness probe runs inside the container
      # and reaches the server by its service name.
      LIVEKIT_URL: ${PUBLIC_LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_INTERNAL_URL: ws://livekit:7880
    depends_on:
      livekit:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  # Self-hosted streaming STT, opt-in. `docker compose up` stays light; add it
  # with `docker compose --profile selfhost-stt up`. The agent reaches it by URL
  # (STT_WHISPER_STREAM_URL=ws://whisper:9090 with STT_PROVIDER=whisper_stream),
  # so in production it moves to its own GPU instance unchanged — a peer service,
  # not part of the app. WhisperLive does LocalAgreement streaming over faster-whisper.
  whisper:
    profiles: ["selfhost-stt"]
    # CPU image by default. For the GPU box use ghcr.io/collabora/whisperlive-gpu
    # and the deploy.resources block below. Pin the tag before deploying; verify
    # against the WhisperLive release you run.
    image: ${WHISPERLIVE_IMAGE:-ghcr.io/collabora/whisperlive-cpu:latest}
    ports:
      - "9090:9090"
    # GPU (uncomment with the -gpu image):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  voice-agent:
    build:
      context: .
      target: agent
    env_file: .env
    environment:
      # The worker registers from inside the network, so it uses the service name.
      LIVEKIT_URL: ws://livekit:7880
      # ops-core-api runs from its own compose file. host.docker.internal is the
      # host as seen from a container on Docker Desktop; on plain Linux add
      # `extra_hosts: ["host.docker.internal:host-gateway"]` or join its network.
      # Deliberately not ${OPS_CORE_BASE_URL:-...}: compose interpolates from
      # .env, and a host-side value like http://localhost:8000 would point the
      # worker at itself. Override with COMPOSE_OPS_CORE_BASE_URL instead.
      OPS_CORE_BASE_URL: ${COMPOSE_OPS_CORE_BASE_URL:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      livekit:
        condition: service_healthy
    # No ports: the worker dials out to LiveKit and is never dialled itself.
