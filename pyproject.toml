[project]
name = "voice-agent-service"
version = "0.1.0"
description = "LiveKit voice agent for restaurant table booking, with deterministic LLM tool-calling"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic-settings>=2.7.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "slowapi>=0.1.9",
    "openai>=1.60.0",
    "livekit-api>=1.0.0",
    "livekit-agents>=1.6.0",
    "livekit-plugins-openai>=1.6.0",
    "livekit-plugins-silero>=1.6.0",
    "livekit-plugins-deepgram>=1.6.0",
    "livekit-plugins-cartesia>=1.6.0",
    "faster-whisper>=1.1.0",
    "websockets>=14.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
# Teaches mypy that pydantic models synthesise their __init__, so settings
# classes with required fields are not reported as missing arguments.
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "slowapi.*", "livekit.plugins.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
